<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Bortolini · Central de Atendimento</title>
<style>
  :root{
    --brand:#dc2626; --brand-2:#b91c1c; --wa:#1d9e75; --wa-dark:#0f6e56;
    --bar:#0f172a; --bar-2:#1e293b; --line:#e5e7eb; --ink:#0f172a; --muted:#64748b;
    --split:60%;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#0b1220;color:var(--ink)}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* Barra superior */
  .topbar{height:52px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:0 0 auto;-webkit-app-region:drag}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(220,38,38,.4)}
  .brand .bt{color:#f8fafc;font-size:.95rem;font-weight:600;line-height:1.1}
  .brand .bs{color:#94a3b8;font-size:.72rem;line-height:1.2}
  .actions{display:flex;align-items:center;gap:6px;-webkit-app-region:no-drag}
  .ic{width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid #334155;color:#cbd5e1;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ic:hover{background:#1e293b;color:#fff}
  .ic.wa:hover{background:var(--wa-dark);border-color:var(--wa)}

  /* Linha de configuração (escondida por padrão) */
  .settings{background:var(--bar-2);display:none;align-items:center;gap:8px;padding:10px 14px;flex:0 0 auto;border-top:1px solid #334155}
  .settings.open{display:flex}
  .settings label{color:#94a3b8;font-size:.78rem}
  .settings input{flex:1;max-width:420px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:8px 11px;font-size:.82rem;-webkit-user-select:text;user-select:text}
  .settings button{background:var(--brand);border:none;color:#fff;border-radius:8px;padding:8px 14px;font-size:.82rem;cursor:pointer;font-weight:600}
  .settings button:hover{background:var(--brand-2)}

  /* Divisão de tela */
  .split{flex:1;display:flex;min-height:0;position:relative;background:var(--line)}
  .pane{display:flex;flex-direction:column;min-width:0;background:#fff}
  #pane-sys{flex:0 0 var(--split)}
  #pane-wa{flex:1}
  .pane-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:0 0 auto;font-size:.74rem;font-weight:600;letter-spacing:.02em;color:var(--ink);background:#f8fafc;border-bottom:1px solid var(--line)}
  .pane-head .dot{width:9px;height:9px;border-radius:50%}
  .pane-head.sys .dot{background:var(--brand)}
  .pane-head.wa .dot{background:var(--wa)}
  .pane-head small{color:var(--muted);font-weight:400;letter-spacing:0}
  webview{flex:1;width:100%;border:none;background:#fff}

  /* Divisor arrastável */
  .divider{width:7px;background:var(--line);cursor:col-resize;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .divider:hover,.divider.active{background:#cbd5e1}
  .divider span{width:3px;height:36px;border-radius:3px;background:#94a3b8}
  /* Camada que captura o mouse durante o arraste (senão a webview "engole" o evento) */
  #drag-overlay{position:absolute;inset:0;z-index:50;cursor:col-resize;display:none}
  #drag-overlay.on{display:block}
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">B</div>
        <div><div class="bt">Bortolini</div><div class="bs">Central de Atendimento</div></div>
      </div>
      <div class="actions">
        <button class="ic" id="reload-sys" title="Recarregar sistema">⟳</button>
        <button class="ic wa" id="reload-wa" title="Recarregar WhatsApp">⟳</button>
        <button class="ic" id="toggle-settings" title="Configurações">⚙</button>
      </div>
    </header>

    <div class="settings" id="settings">
      <label>Endereço do sistema</label>
      <input id="bortolini-url" placeholder="https://bortolini-pizzaria.onrender.com" />
      <button id="go">Abrir</button>
    </div>

    <main class="split">
      <section class="pane" id="pane-sys">
        <div class="pane-head sys"><span class="dot"></span> Sistema Bortolini</div>
        <webview id="wv-bortolini" partition="persist:bortolini" allowpopups></webview>
      </section>

      <div class="divider" id="divider" title="Arraste para ajustar"><span></span></div>

      <section class="pane" id="pane-wa">
        <div class="pane-head wa"><span class="dot"></span> WhatsApp <small>· conecte lendo o QR no celular</small></div>
        <webview
          id="wv-whats"
          src="https://web.whatsapp.com"
          partition="persist:whatsapp"
          useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          allowpopups>
        </webview>
      </section>

      <div id="drag-overlay"></div>
    </main>
  </div>

  <script>
    const DEFAULT_URL = "https://bortolini-pizzaria.onrender.com";
    const $ = (id) => document.getElementById(id);
    const wvBort = $("wv-bortolini"), wvWhats = $("wv-whats");
    const urlInput = $("bortolini-url"), paneSys = $("pane-sys"), splitEl = document.querySelector(".split");
    const divider = $("divider"), overlay = $("drag-overlay");

    function loadBortolini(url){
      url = (url||"").trim() || DEFAULT_URL;
      if(!/^https?:\/\//.test(url)) url = "https://" + url;
      localStorage.setItem("bortolini_url", url);
      urlInput.value = url;
      wvBort.setAttribute("src", url);
    }
    loadBortolini(localStorage.getItem("bortolini_url") || DEFAULT_URL);

    const savedSplit = localStorage.getItem("split_pct");
    if(savedSplit) document.documentElement.style.setProperty("--split", savedSplit + "%");

    $("toggle-settings").addEventListener("click", () => $("settings").classList.toggle("open"));
    $("go").addEventListener("click", () => { loadBortolini(urlInput.value); $("settings").classList.remove("open"); });
    urlInput.addEventListener("keydown", (e) => { if(e.key === "Enter"){ loadBortolini(urlInput.value); $("settings").classList.remove("open"); } });
    $("reload-sys").addEventListener("click", () => wvBort.reload());
    $("reload-wa").addEventListener("click", () => wvWhats.reload());

    let dragging = false;
    divider.addEventListener("mousedown", (e) => {
      dragging = true; overlay.classList.add("on"); divider.classList.add("active"); e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if(!dragging) return;
      const rect = splitEl.getBoundingClientRect();
      let pct = ((e.clientX - rect.left) / rect.width) * 100;
      pct = Math.max(25, Math.min(80, pct));
      document.documentElement.style.setProperty("--split", pct + "%");
    });
    window.addEventListener("mouseup", () => {
      if(!dragging) return;
      dragging = false; overlay.classList.remove("on"); divider.classList.remove("active");
      const pct = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--split"));
      if(!isNaN(pct)) localStorage.setItem("split_pct", Math.round(pct));
    });
  </script>
</body>
</html>
