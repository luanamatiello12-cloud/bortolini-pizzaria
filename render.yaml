services:
  - type: web
    name: bortolini-delivery
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /var/data/bortolini.db
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: APP_SECRET
        generateValue: true
    disks:
      - name: data
        mountPath: /var/data
        sizeGB: 1
